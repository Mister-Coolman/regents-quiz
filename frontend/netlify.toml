[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every page. The CSP is the backstop for the chat's
# server-rendered HTML: with script-src limited to our own bundle, injected
# markup can't run script, not even inline handlers like onmouseover.
# style-src allows inline styles because KaTeX and React set style attributes.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://backend-winter-smoke-307.fly.dev; connect-src 'self' https://backend-winter-smoke-307.fly.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
